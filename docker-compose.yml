name: chess-review

x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: chess-review-backend:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://chess:chess@postgres:5432/chess_review
    REDIS_URL: redis://redis:6379/0
    TEST_DATABASE_URL: postgresql+asyncpg://chess:chess@postgres:5432/chess_review_test
    TEST_REDIS_URL: redis://redis:6379/15
  volumes:
    - ./backend:/app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_review
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_review"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings", "--watch", "app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Telegram-бот (`make bot`): нужен TELEGRAM_BOT_TOKEN в .env; анализ считает worker.
  bot:
    <<: *backend
    command: ["python", "-m", "app.bot"]
    profiles: ["bot"]
    # Временные сбои при старте; без токена — несколько попыток и остановка.
    restart: on-failure:5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    image: chess-review-web:dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
