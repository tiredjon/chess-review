[project]
name = "chess-review-backend"
version = "0.1.0"
description = "Chess Review API и воркер анализа"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "chess>=1.11.2",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "N", "PT", "C4", "PL"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Папка alembic/ — это миграции, а не пакет; сам alembic — сторонняя библиотека.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = ["integration: требует PostgreSQL и Redis"]

[tool.coverage.run]
source = ["app"]
branch = true
